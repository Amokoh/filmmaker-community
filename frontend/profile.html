    <script>
              // Check if the user is logged in
    function isLoggedIn() {
        return localStorage.getItem("token") !== null;
    }

    // Update the account dropdown based on authentication state
    function updateAuthOptions() {
        const authOptions = document.getElementById("authOptions");
        const authOptionsMobile = document.getElementById("authOptionsMobile");

        if (isLoggedIn()) {
            // User is logged in
            authOptions.innerHTML = `
                <a href="/profile.html" class="block px-5 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600 font-medium transition">
                    <i class="fas fa-user-circle mr-2"></i> Profile
                </a>
                <button id="logoutDropdownBtn" class="w-full text-left px-5 py-3 text-gray-700 hover:bg-red-50 hover:text-red-600 font-medium transition">
                    <i class="fas fa-sign-out-alt mr-2"></i> Logout
                </button>
            `;

            authOptionsMobile.innerHTML = `
                <a href="/profile.html" class="block px-4 py-3 text-gray-200 hover:bg-gray-700 rounded-lg font-medium transition">
                    <i class="fas fa-user-circle mr-2"></i> Profile
                </a>
                <button id="logoutSidebarBtn" class="w-full text-left px-4 py-3 text-gray-200 hover:bg-red-700 rounded-lg font-medium transition">
                    <i class="fas fa-sign-out-alt mr-2"></i> Logout
                </button>
            `;
        } else {
            // User is not logged in
            authOptions.innerHTML = `
                <a href="/auth.html" class="block px-5 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600 font-medium transition">
                    <i class="fas fa-sign-in-alt mr-2"></i> Sign In
                </a>
                <a href="/auth.html" class="block px-5 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600 font-medium transition">
                    <i class="fas fa-user-plus mr-2"></i> Sign Up
                </a>
            `;
  authOptionsMobile.innerHTML = `
                <a href="/auth.html" class="block px-4 py-3 text-gray-200 hover:bg-gray-700 rounded-lg font-medium transition">
                    <i class="fas fa-sign-in-alt mr-2"></i> Sign In
                </a>
                <a href="/auth.html" class="block px-4 py-3 text-gray-200 hover:bg-gray-700 rounded-lg font-medium transition">
                    <i class="fas fa-user-plus mr-2"></i> Sign Up
                </a>
            `;
        }
    }

    // Logout functionality
    function handleLogout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "/auth.html";
    }

    

    // Initialize the page
    document.addEventListener("DOMContentLoaded", () => {
        const accountBtn = document.getElementById("accountBtn");
        const dropdownMenu = document.getElementById("dropdownMenu");

        // Update the account dropdown options
        updateAuthOptions();

        // Account Dropdown Toggle
        if (accountBtn && dropdownMenu) {

                event.stopPropagation();

            });
  document.addEventListener("click", (event) => {
                if (!accountBtn.contains(event.target)) {
                    dropdownMenu.classList.add("hidden");
                }
            });
        }

        // Logout functionality
        document.addEventListener("click", (event) => {
            if (event.target.id === "logoutDropdownBtn" || event.target.id === "logoutSidebarBtn") {
                handleLogout();

        // Simulate sign-up or sign-in (for demonstration purposes)
        const authForm = document.getElementById("authForm");
        if (authForm) {
            authForm.addEventListener("submit", (event) => {
                event.preventDefault();
                simulateAuth(); // Simulate authentication
            });

    // Toggle sidebar function
    function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        sidebar.classList.toggle("-translate-x-full");
        sidebar.classList.toggle("hidden");
    }


document.addEventListener("DOMContentLoaded", async () => {
  const API_URL = "https://storysharestudio.com/api/user/profile";
  const token = localStorage.getItem("token");

  if (!token || token === "undefined") {
    alert("Unauthorized. Please log in.");
    window.location.href = "/auth.html";
    return;
  }

  console.log("🔐 Stored token:", token);

  try {
    const res = await fetch(API_URL, {
      headers: { Authorization: `Bearer ${token}` }
    });

    if (!res.ok) {
      const errorData = await res.json();
      console.warn("⚠️ Failed to load profile:", errorData);
      throw new Error(errorData.message || "Failed to fetch profile");
    }

    const user = await res.json();

    // ✅ Safely populate fields
    const profilePic = document.getElementById("previewProfilePic");
    if (profilePic) profilePic.src = user.profilePicture || "/uploads/default-profile.jpg";

    const coverPhoto = document.getElementById("cover-photo");
    if (coverPhoto) coverPhoto.src = user.coverPhoto || "/uploads/default-cover.jpg";

    const usernameField = document.getElementById("profileUsername");
    if (usernameField) usernameField.value = user.username || "";

    const emailField = document.getElementById("profileEmail");
    if (emailField) emailField.value = user.email || "";

    const bioField = document.getElementById("profileBio");
    if (bioField) bioField.value = user.bio || "";

    
  const socialHandlesField = document.getElementById("socialHandles");
    if (socialHandlesField) {
      socialHandlesField.value = user.socialHandles
        ? JSON.stringify(user.socialHandles, null, 2)
        : "";
    }

    const loginStatus = document.getElementById("loginStatus");
    if (loginStatus) {
      loginStatus.textContent = `✅ Logged in as ${user.username} (${user.email})`;
    }

  } catch (err) {
    console.error("❌ Profile fetch error:", err.message);
    alert(`Session expired: ${err.message}`);
    localStorage.removeItem("token");
    window.location.href = "/auth.html";
  }
});


 

// ✅ Handle profile updates
const profileForm = document.getElementById("profileForm");

if (profileForm) {
  profileForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const token = localStorage.getItem("token");

    if (!token) {
      alert("Session expired. Please log in.");
      window.location.href = "/auth.html";
      return;
    }

    const formData = new FormData();

    const usernameInput = document.getElementById("profileUsername");
    if (usernameInput) formData.append("username", usernameInput.value || "");

    const emailInput = document.getElementById("profileEmail");
    if (emailInput) formData.append("email", emailInput.value || "");

    const bioInput = document.getElementById("profileBio");
    if (bioInput) formData.append("bio", bioInput.value || "");

    const socialHandlesInput = document.getElementById("socialHandles");
    if (socialHandlesInput && socialHandlesInput.value.trim()) {
      try {
        const parsed = JSON.parse(socialHandlesInput.value);
        formData.append("socialHandles", JSON.stringify(parsed));
      } catch {
        alert("Invalid social handles format. Please provide valid JSON.");
        return;
      }
    }

    const profilePicInput = document.getElementById("profilePicture");
    if (profilePicInput?.files.length) {
      formData.append("profilePicture", profilePicInput.files[0]);
    }

    const coverPhotoInput = document.getElementById("coverPhoto");
    if (coverPhotoInput?.files.length) {
      formData.append("coverPhoto", coverPhotoInput.files[0]);
    }

    const portfolioInput = document.getElementById("portfolio");
    if (portfolioInput?.files.length) {
      formData.append("portfolio", portfolioInput.files[0]);
    }

    try {
      const res = await fetch("https://storysharestudio.com/api/user/profile", {
        method: "PUT",
        headers: { Authorization: `Bearer ${token}` },
        body: formData
      });

      if (!res.ok) {
        if (res.status === 401) {
          const errorData = await res.json();
          console.warn("⚠️ Unauthorized:", errorData);
          alert(`Session expired: ${errorData.message || "Unauthorized"}`);
          localStorage.removeItem("token");
          window.location.href = "/auth.html";
          return;
        }

        const errorData = await res.json();
        throw new Error(`Profile update failed: ${errorData.message || "Unknown error"}`);
      }

      const result = await res.json();

      // ✅ Optional: refresh token if returned
      if (result.token) {
        localStorage.setItem("token", result.token);
        console.log("🔄 Token refreshed");
      }

      alert("✅ Profile updated!");
      location.reload();

    } catch (err) {
      console.error("❌ Update error:", err);
      alert(`Failed to update profile. ${err.message}`);
    }
  });
}
